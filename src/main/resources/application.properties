# ===== 敏感数据访问网关 - 本地运行配置 =====
server.port=8080
spring.application.name=sensitive-data-gateway

# 请求规模 / 嵌套深度 / 处理耗时上限（可按本地验证需要调整）
gateway.limits.max-payload-bytes=65536
gateway.limits.max-field-count=500
gateway.limits.max-depth=8
gateway.limits.process-timeout-millis=2000
# 审计记录保留条数（超出滚动淘汰最旧记录）
gateway.limits.audit-retention-count=1000

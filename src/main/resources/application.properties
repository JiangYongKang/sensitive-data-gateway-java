# 敏感数据网关本地配置
spring.application.name=sensitive-data-gateway
gateway.max-payload-nodes=1000
gateway.max-depth=10
gateway.processing-timeout-ms=2000
gateway.audit-retention-max-records=10000
# 批量访问：单批最大记录数、整批合计节点上限、单条记录嵌套深度上限
gateway.max-batch-records=200
gateway.max-batch-total-nodes=50000
gateway.max-batch-record-depth=10
logging.level.com.github.highcumontoa=INFO
